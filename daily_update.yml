name: Daily Update

on:
  schedule:
    - cron: '0 0 * * *'   # JST 09:00 = UTC 00:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tatsuno-daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          RAKUTEN_APP_ID_V2: ${{ secrets.RAKUTEN_APP_ID_V2 }}
          RAKUTEN_ACCESS_KEY_V2: ${{ secrets.RAKUTEN_ACCESS_KEY_V2 }}
          RAKUTEN_HTTP_REFERER: https://mizutanigrandee.github.io/
          RAKUTEN_HTTP_ORIGIN: https://mizutanigrandee.github.io
          RAKUTEN_THROTTLE_SEC: '0.55'
          RAKUTEN_MAX_RETRIES: '6'
        run: python update_cache.py

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              'vacancy_price_cache.json',
              'vacancy_price_cache_previous.json',
              'vacancy_price_cache_2p.json',
              'vacancy_price_cache_2p_previous.json',
              'historical_data.json',
              'historical_data_2p.json',
              'finalized_daily_data.json',
              'finalized_daily_data_2p.json',
              'demand_spike_history.json',
              'last_updated.json',
              'hotel_master_tatsuno.json',
          ]

          for name in files:
              text = Path(name).read_text(encoding='utf-8')
              if 'NaN' in text or 'Infinity' in text or '-Infinity' in text:
                  raise SystemExit(f'Invalid numeric token in {name}')
              json.loads(text)
              print(f'OK: {name}')
          PY

      - name: Commit updated cache files
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            vacancy_price_cache.json \
            vacancy_price_cache_previous.json \
            vacancy_price_cache_2p.json \
            vacancy_price_cache_2p_previous.json \
            historical_data.json \
            historical_data_2p.json \
            finalized_daily_data.json \
            finalized_daily_data_2p.json \
            demand_spike_history.json \
            last_updated.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Tatsuno market cache [auto]"
          fi

          git pull --rebase origin main || true
          git push origin HEAD:main
