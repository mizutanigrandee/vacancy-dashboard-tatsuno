name: Convert event_data.xlsx to event_data.json

on:
  push:
    paths:
      - 'event_data.xlsx'
      - '.github/workflows/convert_event_data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Convert Excel to JSON
        run: python convert_event_data.py

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('event_data.json').read_text(encoding='utf-8')
          if 'NaN' in text or 'Infinity' in text or '-Infinity' in text:
              raise SystemExit('Invalid numeric token in event_data.json')
          json.loads(text)
          print('event_data.json OK')
          PY

      - name: Commit and push event_data.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add event_data.json
          git commit -m 'Update Tatsuno event_data.json [auto]' || echo "No changes"
          git pull --rebase origin main || true
          git push origin HEAD:main
